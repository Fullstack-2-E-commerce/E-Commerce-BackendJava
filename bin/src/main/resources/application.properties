spring.application.name=E-Commerce-BackendJavaSpring

# Conexión a Base de Datos en Memoria (H2)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola Web para ver tus tablas de forma gráfica
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate: Crea automáticamente las tablas 'productos' y 'usuarios'
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
