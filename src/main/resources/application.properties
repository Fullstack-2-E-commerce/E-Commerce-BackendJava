# ==========================================
# Configuración Servidor y Puerto
# ==========================================
server.port=8081
spring.application.name=E-Commerce-BackendJavaSpring

# ==========================================
# Conexión a PostgreSQL Local
# ==========================================
# Asume que tu base de datos local se llama 'javadb'
spring.datasource.url=jdbc:postgresql://localhost:5432/javadb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Configuración JPA / Hibernate (Tablas SQL)
# ==========================================
# 'update' genera y actualiza las tablas (productos y usuarios) automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Consola H2 (Opcional para pruebas en memoria)
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Documentación Swagger UI
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ==========================================
# Actuator (Monitoreo)
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics